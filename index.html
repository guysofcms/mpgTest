<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tesla MCU1 Video Test</title>

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            width: 100%;
            height: 100%;
        }

        #container {
            width: 100%;
            height: 100%;
            text-align: center;
        }

        #title {
            padding: 8px;
            font-size: 18px;
        }

        #video {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            max-height: 82vh;
            background: #111;
        }

        #controls {
            margin-top: 10px;
        }

        button {
            font-size: 20px;
            padding: 10px 22px;
            margin: 4px;
        }

        #status {
            margin-top: 8px;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>

<body>

<div id="container">

    <div id="title">
        Tesla MCU1 Video Test
    </div>

    <video
        id="video"
        width="640"
        controls
        preload="metadata"
        playsinline>
        
        <source src="episodio1.mp4" type="video/mp4">

        Tu navegador no soporta video HTML5.
    </video>

    <div id="controls">
        <button onclick="playVideo()">Play</button>
        <button onclick="pauseVideo()">Pause</button>
        <button onclick="restartVideo()">Inicio</button>
    </div>

    <div id="status">
        Esperando...
    </div>

</div>

<script type="text/javascript">

var video = document.getElementById("video");
var statusBox = document.getElementById("status");

function playVideo() {
    try {
        video.play();
        statusBox.innerHTML = "Reproduciendo";
    } catch (e) {
        statusBox.innerHTML = "Error play: " + e;
    }
}

function pauseVideo() {
    video.pause();
    statusBox.innerHTML = "Pausado";
}

function restartVideo() {
    try {
        video.currentTime = 0;
        video.play();
    } catch (e) {
        statusBox.innerHTML = "Error restart: " + e;
    }
}

video.addEventListener("loadedmetadata", function() {
    statusBox.innerHTML =
        "Video cargado - " +
        video.videoWidth +
        "x" +
        video.videoHeight;
}, false);

video.addEventListener("error", function() {

    var message = "Error de video";

    if (video.error) {

        if (video.error.code == 1) {
            message = "MEDIA_ERR_ABORTED";
        }

        if (video.error.code == 2) {
            message = "MEDIA_ERR_NETWORK";
        }

        if (video.error.code == 3) {
            message = "MEDIA_ERR_DECODE";
        }

        if (video.error.code == 4) {
            message = "MEDIA_ERR_SRC_NOT_SUPPORTED";
        }
    }

    statusBox.innerHTML = message;

}, false);

</script>

</body>
</html>
