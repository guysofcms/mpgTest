<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tesla MCU1 Player</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        #player {
            width: 100%;
            text-align: center;
        }

        #pantalla {
            width: 100%;
            height: auto;
            background: #000;
            display: block;
        }

        #controles {
            padding: 15px 25px 25px 25px;
            background: #161616;
        }

        #botones {
            text-align: center;
            margin-bottom: 15px;
        }

        button {
            font-size: 24px;
            padding: 12px 25px;
            margin: 5px;
        }

        .fila {
            width: 100%;
            margin-top: 18px;
            margin-bottom: 18px;
        }

        .titulo {
            font-size: 21px;
            margin-bottom: 8px;
        }

        input[type=range] {
            width: 100%;
            height: 35px;
        }

        #tiempo {
            font-size: 22px;
            text-align: center;
            margin-top: 5px;
        }

        #volumenTexto {
            font-size: 20px;
            float: right;
        }

        #estado {
            font-size: 17px;
            color: #aaa;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<div id="player">

    <canvas id="pantalla"></canvas>

    <div id="controles">

        <div id="botones">

            <button onclick="reproducir()">
                PLAY
            </button>

            <button onclick="pausar()">
                PAUSA
            </button>

            <button onclick="retroceder()">
                -30s
            </button>

            <button onclick="avanzar()">
                +30s
            </button>

        </div>


        <!-- BARRA DE TIEMPO -->

        <div class="fila">

            <div class="titulo">
                Posicion
            </div>

            <input
                id="barraTiempo"
                type="range"
                min="0"
                max="1301.72"
                step="1"
                value="0"
                onchange="cambiarTiempo(this.value)"
                onmousedown="moviendoBarra=true"
                onmouseup="moviendoBarra=false"
                ontouchstart="moviendoBarra=true"
                ontouchend="moviendoBarra=false"
            >

            <div id="tiempo">
                00:00 / 21:41
            </div>

        </div>


        <!-- VOLUMEN -->

        <div class="fila">

            <div class="titulo">
                Volumen
                <span id="volumenTexto">70%</span>
            </div>

            <input
                id="barraVolumen"
                type="range"
                min="0"
                max="100"
                step="1"
                value="70"
                oninput="cambiarVolumen(this.value)"
                onchange="cambiarVolumen(this.value)"
            >

        </div>

        <div id="estado">
            Inicializando reproductor...
        </div>

    </div>

</div>


<script src="jsmpeg.min.js"></script>


<script>

/*
 =========================================================
 CONFIGURACION
 =========================================================
 */

var VIDEO_URL =
"https://media.githubusercontent.com/media/guysofcms/mpgTest/refs/heads/main/episodio1.mjpg";


/*
 Duracion obtenida con ffprobe:
 00:21:41.72
 */
var DURACION = 1301.72;


/*
 =========================================================
 ELEMENTOS
 =========================================================
 */

var canvas =
    document.getElementById("pantalla");

var barraTiempo =
    document.getElementById("barraTiempo");

var barraVolumen =
    document.getElementById("barraVolumen");

var volumenTexto =
    document.getElementById("volumenTexto");

var tiempoTexto =
    document.getElementById("tiempo");

var estado =
    document.getElementById("estado");


var player = null;

var moviendoBarra = false;


/*
 =========================================================
 CREAR JSMPEG
 =========================================================
 */

try {

    player = new JSMpeg.Player(
        VIDEO_URL,
        {
            canvas: canvas,

            autoplay: false,

            loop: false,

            audio: true,

            video: true,


            /*
             * Dejamos WebGL disponible.
             *
             * Si el MCU1 no lo soporta,
             * JSMpeg vuelve automaticamente
             * a Canvas2D.
             *
             * Puede ayudar a descargar trabajo
             * de la CPU.
             */
            disableGl: false,


            /*
             * Seguimos desactivando WASM
             * para máxima compatibilidad MCU1.
             */
            disableWebAssembly: true,


            progressive: true,

            throttled: true,

            chunkSize: 1024 * 1024,

            decodeFirstFrame: true,


            onSourceEstablished: function() {

                estado.innerHTML =
                    "Video conectado";

            },


            onPlay: function() {

                estado.innerHTML =
                    "Reproduciendo";

            },


            onPause: function() {

                estado.innerHTML =
                    "Pausa";

            },


            onStalled: function() {

                estado.innerHTML =
                    "Cargando datos...";

            },


            onEnded: function() {

                estado.innerHTML =
                    "Fin del video";

            }

        }
    );


    /*
     * Volumen inicial 70%
     */
    player.volume = 0.70;

    estado.innerHTML =
        "Preparado - pulsa PLAY";

}
catch(e) {

    estado.innerHTML =
        "ERROR: " + e.message;

}


/*
 =========================================================
 DESBLOQUEAR WEBAUDIO
 =========================================================
 */

function desbloquearAudio(callback) {

    if (!player || !player.audioOut) {

        if (callback) {
            callback();
        }

        return;
    }


    /*
     * Intentamos reanudar AudioContext
     */
    try {

        if (
            player.audioOut.context &&
            player.audioOut.context.resume
        ) {

            player.audioOut.context.resume();

        }

    }
    catch(e) {
    }


    /*
     * Desbloqueo JSMpeg
     */
    try {

        if (
            player.audioOut.unlock &&
            !player.audioOut.unlocked
        ) {

            player.audioOut.unlock(
                function() {

                    if (callback) {
                        callback();
                    }

                }
            );

            return;

        }

    }
    catch(e) {
    }


    if (callback) {
        callback();
    }

}


/*
 =========================================================
 PLAY
 =========================================================
 */

function reproducir() {

    if (!player) {
        return;
    }

    desbloquearAudio(
        function() {

            player.play();

        }
    );

}


/*
 =========================================================
 PAUSA
 =========================================================
 */

function pausar() {

    if (!player) {
        return;
    }

    player.pause();

}


/*
 =========================================================
 VOLUMEN
 =========================================================
 */

function cambiarVolumen(valor) {

    if (!player) {
        return;
    }

    var volumen =
        parseInt(valor, 10) / 100;

    player.volume = volumen;

    volumenTexto.innerHTML =
        valor + "%";

}


/*
 =========================================================
 CAMBIAR POSICION
 =========================================================
 */

function irATiempo(segundos) {

    if (!player) {
        return;
    }


    segundos =
        parseFloat(segundos);


    if (segundos < 0) {
        segundos = 0;
    }


    if (segundos > DURACION) {
        segundos = DURACION;
    }


    /*
     * Guardamos si estaba reproduciendo.
     */
    var estabaReproduciendo =
        !player.paused;


    /*
     * Importante:
     *
     * pause() hace que JSMpeg corte
     * el audio que ya tenia encolado.
     *
     * Esto evita escuchar audio
     * correspondiente a la posicion anterior.
     */
    player.pause();


    /*
     * JSMpeg permite cambiar currentTime.
     */
    player.currentTime =
        segundos;


    barraTiempo.value =
        segundos;


    actualizarTextoTiempo(
        segundos
    );


    /*
     * Si antes estaba reproduciendo,
     * continuamos.
     */
    if (estabaReproduciendo) {

        desbloquearAudio(
            function() {

                player.play();

            }
        );

    }

}


/*
 =========================================================
 BARRA DE TIEMPO
 =========================================================
 */

function cambiarTiempo(valor) {

    moviendoBarra = false;

    irATiempo(
        parseFloat(valor)
    );

}


/*
 =========================================================
 +/- 30 SEGUNDOS
 =========================================================
 */

function avanzar() {

    if (!player) {
        return;
    }

    irATiempo(
        player.currentTime + 30
    );

}


function retroceder() {

    if (!player) {
        return;
    }

    irATiempo(
        player.currentTime - 30
    );

}


/*
 =========================================================
 MOSTRAR TIEMPO
 =========================================================
 */

function formatoTiempo(segundos) {

    segundos =
        Math.max(
            0,
            Math.floor(segundos)
        );


    var minutos =
        Math.floor(
            segundos / 60
        );


    var seg =
        segundos % 60;


    if (minutos < 10) {

        minutos =
            "0" + minutos;

    }


    if (seg < 10) {

        seg =
            "0" + seg;

    }


    return minutos + ":" + seg;

}


function actualizarTextoTiempo(actual) {

    tiempoTexto.innerHTML =
        formatoTiempo(actual) +
        " / " +
        formatoTiempo(DURACION);

}


/*
 =========================================================
 ACTUALIZAR INTERFAZ
 =========================================================
 */

/*
 * Medio segundo es suficiente y ahorramos
 * trabajo al MCU1.
 */
setInterval(
    function() {

        if (!player) {
            return;
        }


        var actual =
            player.currentTime || 0;


        if (!moviendoBarra) {

            barraTiempo.value =
                actual;

        }


        actualizarTextoTiempo(
            actual
        );

    },
    500
);

</script>

</body>
</html>
