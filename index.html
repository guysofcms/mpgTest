<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tesla MCU1 MJPEG</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        #pantalla {
            display: block;
            width: 100%;
            height: auto;
            background: black;
        }

        #controles {
            padding: 15px;
            text-align: center;
            background: #111;
        }

        button {
            font-size: 28px;
            padding: 15px 40px;
            margin: 10px;
        }

        #estado {
            margin-top: 10px;
            font-size: 20px;
        }
    </style>
</head>

<body>

<canvas id="pantalla"></canvas>

<div id="controles">

    <button onclick="reproducir()">
        PLAY
    </button>

    <button onclick="pausar()">
        PAUSA
    </button>

    <div id="estado">
        Preparando reproductor MJPEG...
    </div>

</div>


<script>

/*
=========================================================
CONFIGURACION
=========================================================
*/

/*
IMPORTANTE:

Si generaste el MJPG a 15 fps,
deja FPS = 15.

Si lo generaste a 20 fps,
pon FPS = 20.
*/

var FPS = 25;


/*
Archivo MJPG en GitHub LFS.
*/

var VIDEO_URL =
"https://media.githubusercontent.com/media/guysofcms/mpgTest/refs/heads/main/episodio1.mjpg";


/*
Tamaño de cada bloque que descargamos.

1 MB.
*/

var CHUNK_SIZE =
1024 * 1024;


/*
Número máximo aproximado de imágenes
que guardaremos en RAM.
*/

var MAX_FRAMES =
45;


/*
Cuando queden menos de estas imágenes,
pedimos otro bloque.
*/

var MIN_FRAMES =
15;


/*
=========================================================
VARIABLES
=========================================================
*/

var canvas =
document.getElementById("pantalla");

var ctx =
canvas.getContext("2d");

var estado =
document.getElementById("estado");


var frames = [];

var pendiente =
new Uint8Array(0);

var offset = 0;

var descargando = false;

var finArchivo = false;

var reproduciendo = false;

var primerFrame = true;


/*
Para las imágenes JPEG.
*/

var imagen =
new Image();


/*
Compatibilidad URL / webkitURL.
*/

var URL_API =
window.URL ||
window.webkitURL;


/*
=========================================================
UTILIDADES
=========================================================
*/

function mostrar(texto) {

    estado.innerHTML = texto;

}


/*
Copiar una parte de Uint8Array.

No usamos .slice() para mejorar
compatibilidad con navegadores antiguos.
*/

function copiar(datos, inicio, fin) {

    var longitud =
        fin - inicio;

    var salida =
        new Uint8Array(longitud);

    var i;

    for (i = 0; i < longitud; i++) {

        salida[i] =
            datos[inicio + i];

    }

    return salida;
}


/*
Combinar dos Uint8Array.
*/

function unir(a, b) {

    var salida =
        new Uint8Array(
            a.length + b.length
        );

    var i;

    for (i = 0; i < a.length; i++) {

        salida[i] = a[i];

    }

    for (i = 0; i < b.length; i++) {

        salida[a.length + i] =
            b[i];

    }

    return salida;
}


/*
=========================================================
BUSCAR JPEG DENTRO DEL MJPG
=========================================================

JPEG comienza con:

FF D8

y termina con:

FF D9
*/

function procesarBloque(nuevoBloque) {

    var datos =
        unir(
            pendiente,
            nuevoBloque
        );

    var inicio = -1;

    var i = 0;


    while (i < datos.length - 1) {


        /*
        Buscar comienzo JPEG.
        */

        if (inicio < 0) {

            if (
                datos[i] === 255 &&
                datos[i + 1] === 216
            ) {

                inicio = i;

                i += 2;

                continue;
            }

        }


        /*
        Buscar final JPEG.
        */

        else {

            if (
                datos[i] === 255 &&
                datos[i + 1] === 217
            ) {

                var frame =
                    copiar(
                        datos,
                        inicio,
                        i + 2
                    );


                frames.push(frame);


                inicio = -1;

                i += 2;

                continue;
            }

        }


        i++;
    }


    /*
    Si quedó un JPEG incompleto,
    lo guardamos para unirlo con
    el siguiente bloque.
    */

    if (inicio >= 0) {

        pendiente =
            copiar(
                datos,
                inicio,
                datos.length
            );

    }

    else {

        /*
        Conservar un posible FF situado
        justo al final del bloque.
        */

        if (
            datos.length > 0 &&
            datos[datos.length - 1] === 255
        ) {

            pendiente =
                copiar(
                    datos,
                    datos.length - 1,
                    datos.length
                );

        }

        else {

            pendiente =
                new Uint8Array(0);

        }

    }

}


/*
=========================================================
DESCARGAR BLOQUES CON HTTP RANGE
=========================================================
*/

function descargarBloque() {

    if (descargando) {
        return;
    }

    if (finArchivo) {
        return;
    }

    if (frames.length >= MAX_FRAMES) {
        return;
    }


    descargando = true;


    var inicio =
        offset;

    var final =
        offset +
        CHUNK_SIZE -
        1;


    var xhr =
        new XMLHttpRequest();


    xhr.open(
        "GET",
        VIDEO_URL,
        true
    );


    /*
    Pedimos solo una parte del archivo.
    */

    xhr.setRequestHeader(
        "Range",
        "bytes=" +
        inicio +
        "-" +
        final
    );


    xhr.responseType =
        "arraybuffer";


    xhr.onreadystatechange =
        function() {


            if (xhr.readyState !== 4) {
                return;
            }


            descargando = false;


            /*
            206 = Partial Content.

            Es exactamente lo que queremos.
            */

            if (
                xhr.status === 206
            ) {


                var datos =
                    new Uint8Array(
                        xhr.response
                    );


                if (datos.length === 0) {

                    finArchivo = true;

                    return;
                }


                procesarBloque(datos);


                offset +=
                    datos.length;


                mostrar(
                    "MJPEG OK | Frames preparados: " +
                    frames.length
                );


                /*
                Si el bloque recibido fue
                menor de 1 MB, probablemente
                hemos llegado al final.
                */

                if (
                    datos.length <
                    CHUNK_SIZE
                ) {

                    finArchivo = true;

                }


                /*
                Llenar buffer si todavía
                tenemos pocos frames.
                */

                if (
                    frames.length <
                    MIN_FRAMES &&
                    !finArchivo
                ) {

                    descargarBloque();

                }

            }


            else {

                mostrar(
                    "ERROR HTTP: " +
                    xhr.status +
                    "<br>" +
                    "No se pudo leer el MJPEG por bloques."
                );

            }

        };


    try {

        xhr.send(null);

    }

    catch(e) {

        descargando = false;

        mostrar(
            "ERROR XHR: " +
            e.message
        );

    }

}


/*
=========================================================
CREAR BLOB JPEG
=========================================================
*/

function crearBlob(datos) {

    try {

        return new Blob(
            [datos],
            {
                type: "image/jpeg"
            }
        );

    }

    catch(e) {


        /*
        Fallback para WebKit viejo.
        */

        var BlobBuilder =
            window.WebKitBlobBuilder ||
            window.MozBlobBuilder;


        if (BlobBuilder) {

            var bb =
                new BlobBuilder();

            bb.append(
                datos.buffer
            );

            return bb.getBlob(
                "image/jpeg"
            );

        }


        throw e;

    }

}


/*
=========================================================
MOSTRAR SIGUIENTE FRAME
=========================================================
*/

function siguienteFrame() {

    if (!reproduciendo) {
        return;
    }


    /*
    Si no tenemos frames,
    esperamos mientras descargamos.
    */

    if (frames.length === 0) {

        if (finArchivo) {

            mostrar(
                "Fin del video"
            );

            reproduciendo = false;

            return;
        }


        mostrar(
            "Cargando datos..."
        );


        descargarBloque();


        setTimeout(
            siguienteFrame,
            100
        );


        return;
    }


    /*
    Pedir más datos antes de
    quedarnos sin buffer.
    */

    if (
        frames.length <
        MIN_FRAMES
    ) {

        descargarBloque();

    }


    var frame =
        frames.shift();


    var blob;

    try {

        blob =
            crearBlob(frame);

    }

    catch(e) {

        mostrar(
            "ERROR Blob: " +
            e.message
        );

        reproduciendo = false;

        return;
    }


    if (
        !URL_API ||
        !URL_API.createObjectURL
    ) {

        mostrar(
            "Este navegador no soporta createObjectURL"
        );

        reproduciendo = false;

        return;
    }


    var url =
        URL_API.createObjectURL(
            blob
        );


    var inicioDecode =
        new Date().getTime();


    imagen.onload =
        function() {


            /*
            En el primer frame configuramos
            la resolución real del canvas.
            */

            if (primerFrame) {

                canvas.width =
                    imagen.width;

                canvas.height =
                    imagen.height;

                primerFrame = false;

            }


            ctx.drawImage(
                imagen,
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
            Liberamos memoria.
            */

            try {

                URL_API.revokeObjectURL(
                    url
                );

            }

            catch(e) {
            }


            /*
            Mantener FPS aproximados.
            */

            var usado =
                new Date().getTime() -
                inicioDecode;


            var tiempoFrame =
                1000 / FPS;


            var espera =
                tiempoFrame -
                usado;


            if (espera < 0) {
                espera = 0;
            }


            if (reproduciendo) {

                setTimeout(
                    siguienteFrame,
                    espera
                );

            }

        };


    imagen.onerror =
        function() {

            try {

                URL_API.revokeObjectURL(
                    url
                );

            }

            catch(e) {
            }


            /*
            Saltamos frame defectuoso.
            */

            if (reproduciendo) {

                setTimeout(
                    siguienteFrame,
                    1
                );

            }

        };


    imagen.src =
        url;

}


/*
=========================================================
PLAY
=========================================================
*/

function reproducir() {

    if (reproduciendo) {
        return;
    }


    reproduciendo = true;


    mostrar(
        "Iniciando MJPEG..."
    );


    /*
    Si todavía no descargamos nada,
    arrancamos la descarga.
    */

    if (
        frames.length === 0 &&
        !finArchivo
    ) {

        descargarBloque();

    }


    siguienteFrame();

}


/*
=========================================================
PAUSA
=========================================================
*/

function pausar() {

    reproduciendo = false;

    mostrar(
        "Pausa | Frames preparados: " +
        frames.length
    );

}


/*
=========================================================
PRECARGA INICIAL
=========================================================
*/

mostrar(
    "Preparando MJPEG..."
);

descargarBloque();

</script>

</body>
</html>
