<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tesla MCU1 - JSMpeg</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h2 {
            font-size: 32px;
        }

        canvas {
            width: 100%;
            max-width: 100%;
            background: black;
        }

        button {
            font-size: 28px;
            padding: 15px 40px;
            margin: 15px;
        }

        #estado {
            font-size: 22px;
            padding: 15px;
        }
    </style>
</head>

<body>

<h2>Tesla MCU1 - MPEG1</h2>

<canvas id="pantalla"></canvas>

<br>

<button onclick="playVideo()">PLAY</button>
<button onclick="pauseVideo()">PAUSA</button>

<div id="estado">Cargando JSMpeg...</div>

<script src="jsmpeg.min.js"></script>

<script>
var estado = document.getElementById("estado");
var canvas = document.getElementById("pantalla");

var url =
"https://media.githubusercontent.com/media/guysofcms/mpgTest/refs/heads/main/episodio1.ts";

var primerFrame = true;

try {

    var player = new JSMpeg.Player(url, {
        canvas: canvas,

        autoplay: false,
        loop: false,

        // Primero probamos sin audio
        audio: false,

        // Compatibilidad con navegadores antiguos
        disableGl: true,
        disableWebAssembly: true,

        // Descargar el vídeo por partes
        progressive: true,
        throttled: true,

        decodeFirstFrame: true,

        onSourceEstablished: function() {
            estado.innerHTML = "Conexión con el vídeo OK";
        },

        onVideoDecode: function() {
            if (primerFrame) {
                estado.innerHTML = "¡MPEG-1 DECODIFICANDO!";
                primerFrame = false;
            }
        },

        onPlay: function() {
            estado.innerHTML = "Reproduciendo...";
        },

        onPause: function() {
            estado.innerHTML = "Pausado";
        },

        onStalled: function() {
            estado.innerHTML = "Esperando datos...";
        },

        onEnded: function() {
            estado.innerHTML = "Fin del vídeo";
        }
    });

    estado.innerHTML = "JSMpeg preparado - pulsa PLAY";

}
catch (e) {

    estado.innerHTML =
        "ERROR: " + e.message;
}

function playVideo() {

    try {
        estado.innerHTML = "Intentando reproducir...";
        player.play();
    }
    catch(e) {
        estado.innerHTML =
            "ERROR PLAY: " + e.message;
    }
}

function pauseVideo() {

    try {
        player.pause();
    }
    catch(e) {
        estado.innerHTML =
            "ERROR PAUSA: " + e.message;
    }
}
</script>

</body>
</html>
