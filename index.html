<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tesla MCU1 MJPEG</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        #pantalla {
            display: block;
            width: 100%;
            height: auto;
            background: black;
        }

        #controles {
            padding: 15px;
            text-align: center;
            background: #111;
        }

        button {
            font-size: 28px;
            padding: 15px 40px;
            margin: 10px;
        }

        #volumenZona {
            margin: 15px auto;
            width: 90%;
            max-width: 700px;
        }

        #barraVolumen {
            width: 100%;
            height: 35px;
        }

        #volumenTexto {
            font-size: 20px;
            margin-bottom: 5px;
        }

        #tiempo {
            font-size: 20px;
            margin-top: 10px;
        }

        #estado {
            margin-top: 10px;
            font-size: 20px;
        }
    </style>
</head>

<body>

<canvas id="pantalla"></canvas>

<!-- AUDIO SEPARADO -->
<audio
    id="audio"
    preload="auto"
    src="https://media.githubusercontent.com/media/guysofcms/mpgTest/refs/heads/main/episodio1.mp3">
</audio>


<div id="controles">

    <button onclick="reproducir()">
        PLAY
    </button>

    <button onclick="pausar()">
        PAUSA
    </button>


    <div id="volumenZona">

        <div id="volumenTexto">
            Volumen: 70%
        </div>

        <input
            id="barraVolumen"
            type="range"
            min="0"
            max="100"
            value="70"
            onchange="cambiarVolumen(this.value)"
            oninput="cambiarVolumen(this.value)"
        >

    </div>


    <div id="tiempo">
        00:00
    </div>


    <div id="estado">
        Preparando reproductor MJPEG...
    </div>

</div>


<script>

/*
=========================================================
CONFIGURACION
=========================================================
*/

/*
IMPORTANTE:

Este FPS debe ser el mismo con el que
generaste episodio1.mjpg.
*/

var FPS = 25;


/*
VIDEO MJPEG
*/

var VIDEO_URL =
"https://media.githubusercontent.com/media/guysofcms/mpgTest/refs/heads/main/episodio1.mjpg";


/*
Descargamos el vídeo por bloques de 1 MB.
*/

var CHUNK_SIZE =
1024 * 1024;


/*
Frames máximos guardados en memoria.
*/

var MAX_FRAMES = 60;


/*
Cuando queden menos frames,
pedimos otro bloque.
*/

var MIN_FRAMES = 25;


/*
=========================================================
ELEMENTOS
=========================================================
*/

var canvas =
document.getElementById("pantalla");

var ctx =
canvas.getContext("2d");

var estado =
document.getElementById("estado");

var audio =
document.getElementById("audio");

var tiempoTexto =
document.getElementById("tiempo");

var volumenTexto =
document.getElementById("volumenTexto");


/*
Volumen inicial.
*/

audio.volume = 0.70;


/*
=========================================================
VARIABLES
=========================================================
*/

var frames = [];

var pendiente =
new Uint8Array(0);

var offset = 0;

var descargando = false;

var finArchivo = false;

var reproduciendo = false;

var primerFrame = true;


/*
Número global del siguiente frame
que tenemos que reproducir.
*/

var numeroFrame = 0;


/*
Evita intentar decodificar dos JPEG
simultáneamente.
*/

var decodificando = false;


/*
Imagen JPEG.
*/

var imagen =
new Image();


/*
Compatibilidad con WebKit antiguo.
*/

var URL_API =
window.URL ||
window.webkitURL;


/*
=========================================================
UTILIDADES
=========================================================
*/

function mostrar(texto) {

    estado.innerHTML = texto;

}


/*
Copiar Uint8Array sin usar métodos
modernos que MCU1 podría no soportar.
*/

function copiar(datos, inicio, fin) {

    var longitud =
        fin - inicio;

    var salida =
        new Uint8Array(longitud);

    var i;

    for (i = 0; i < longitud; i++) {

        salida[i] =
            datos[inicio + i];

    }

    return salida;
}


/*
Combinar dos Uint8Array.
*/

function unir(a, b) {

    var salida =
        new Uint8Array(
            a.length + b.length
        );

    var i;

    for (i = 0; i < a.length; i++) {

        salida[i] = a[i];

    }

    for (i = 0; i < b.length; i++) {

        salida[a.length + i] =
            b[i];

    }

    return salida;
}


/*
=========================================================
BUSCAR LOS JPEG DENTRO DEL MJPG
=========================================================

JPEG:

inicio = FF D8
final  = FF D9
*/

function procesarBloque(nuevoBloque) {

    var datos =
        unir(
            pendiente,
            nuevoBloque
        );

    var inicio = -1;

    var i = 0;


    while (i < datos.length - 1) {


        /*
        Inicio JPEG.
        */

        if (inicio < 0) {

            if (
                datos[i] === 255 &&
                datos[i + 1] === 216
            ) {

                inicio = i;

                i += 2;

                continue;
            }

        }


        /*
        Final JPEG.
        */

        else {

            if (
                datos[i] === 255 &&
                datos[i + 1] === 217
            ) {

                var frame =
                    copiar(
                        datos,
                        inicio,
                        i + 2
                    );


                frames.push(frame);


                inicio = -1;

                i += 2;

                continue;
            }

        }


        i++;
    }


    /*
    JPEG incompleto al final.
    */

    if (inicio >= 0) {

        pendiente =
            copiar(
                datos,
                inicio,
                datos.length
            );

    }

    else {

        /*
        Posible FF al final del bloque.
        */

        if (
            datos.length > 0 &&
            datos[datos.length - 1] === 255
        ) {

            pendiente =
                copiar(
                    datos,
                    datos.length - 1,
                    datos.length
                );

        }

        else {

            pendiente =
                new Uint8Array(0);

        }

    }

}


/*
=========================================================
DESCARGAR MJPEG POR HTTP RANGE
=========================================================
*/

function descargarBloque() {

    if (descargando) {
        return;
    }

    if (finArchivo) {
        return;
    }

    if (frames.length >= MAX_FRAMES) {
        return;
    }


    descargando = true;


    var inicio =
        offset;

    var final =
        offset +
        CHUNK_SIZE -
        1;


    var xhr =
        new XMLHttpRequest();


    xhr.open(
        "GET",
        VIDEO_URL,
        true
    );


    xhr.setRequestHeader(
        "Range",
        "bytes=" +
        inicio +
        "-" +
        final
    );


    xhr.responseType =
        "arraybuffer";


    xhr.onreadystatechange =
        function() {


            if (xhr.readyState !== 4) {
                return;
            }


            descargando = false;


            if (xhr.status === 206) {


                var datos =
                    new Uint8Array(
                        xhr.response
                    );


                if (datos.length === 0) {

                    finArchivo = true;

                    return;
                }


                procesarBloque(datos);


                offset +=
                    datos.length;


                /*
                Si recibimos menos de lo pedido,
                estamos al final.
                */

                if (
                    datos.length <
                    CHUNK_SIZE
                ) {

                    finArchivo = true;

                }


                /*
                Continuamos llenando buffer.
                */

                if (
                    frames.length <
                    MIN_FRAMES &&
                    !finArchivo
                ) {

                    descargarBloque();

                }

            }

            else {

                mostrar(
                    "ERROR HTTP MJPEG: " +
                    xhr.status
                );

            }

        };


    try {

        xhr.send(null);

    }

    catch(e) {

        descargando = false;

        mostrar(
            "ERROR XHR: " +
            e.message
        );

    }

}


/*
=========================================================
CREAR JPEG BLOB
=========================================================
*/

function crearBlob(datos) {

    try {

        return new Blob(
            [datos],
            {
                type: "image/jpeg"
            }
        );

    }

    catch(e) {


        var BlobBuilder =
            window.WebKitBlobBuilder ||
            window.MozBlobBuilder;


        if (BlobBuilder) {

            var bb =
                new BlobBuilder();

            bb.append(
                datos.buffer
            );

            return bb.getBlob(
                "image/jpeg"
            );

        }


        throw e;

    }

}


/*
=========================================================
RELOJ MAESTRO = AUDIO
=========================================================

El audio decide qué frame debería
estar mostrándose.

Ejemplo:

audio = 10 segundos
FPS   = 15

frame esperado = 150
*/

function actualizarVideo() {

    if (!reproduciendo) {
        return;
    }


    if (decodificando) {

        setTimeout(
            actualizarVideo,
            10
        );

        return;
    }


    /*
    Tiempo real del audio.
    */

    var tiempoAudio =
        audio.currentTime || 0;


    var frameEsperado =
        Math.floor(
            tiempoAudio * FPS
        );


    /*
    Si el vídeo se ha quedado atrás,
    descartamos frames.

    Esto evita que el retraso se vaya
    acumulando.
    */

    while (
        numeroFrame < frameEsperado &&
        frames.length > 1
    ) {

        frames.shift();

        numeroFrame++;

    }


    /*
    Todavía no toca mostrar
    el siguiente frame.
    */

    if (
        numeroFrame > frameEsperado
    ) {

        setTimeout(
            actualizarVideo,
            10
        );

        return;
    }


    /*
    Nos hemos quedado sin datos.
    */

    if (frames.length === 0) {


        if (finArchivo) {

            reproduciendo = false;

            audio.pause();

            mostrar(
                "Fin del video"
            );

            return;
        }


        mostrar(
            "Cargando datos..."
        );


        descargarBloque();


        setTimeout(
            actualizarVideo,
            50
        );


        return;

    }


    /*
    Pedir más vídeo antes
    de vaciar el buffer.
    */

    if (
        frames.length <
        MIN_FRAMES
    ) {

        descargarBloque();

    }


    /*
    Mostrar siguiente JPEG.
    */

    mostrarFrame();

}


/*
=========================================================
MOSTRAR FRAME JPEG
=========================================================
*/

function mostrarFrame() {

    if (frames.length === 0) {

        decodificando = false;

        return;
    }


    decodificando = true;


    var frame =
        frames.shift();


    numeroFrame++;


    var blob;


    try {

        blob =
            crearBlob(frame);

    }

    catch(e) {

        decodificando = false;

        mostrar(
            "ERROR Blob: " +
            e.message
        );

        return;
    }


    if (
        !URL_API ||
        !URL_API.createObjectURL
    ) {

        decodificando = false;

        mostrar(
            "createObjectURL no disponible"
        );

        return;
    }


    var url =
        URL_API.createObjectURL(
            blob
        );


    imagen.onload =
        function() {


            /*
            Configuramos resolución real
            en el primer frame.
            */

            if (primerFrame) {

                canvas.width =
                    imagen.width;

                canvas.height =
                    imagen.height;

                primerFrame = false;

            }


            ctx.drawImage(
                imagen,
                0,
                0,
                canvas.width,
                canvas.height
            );


            try {

                URL_API.revokeObjectURL(
                    url
                );

            }

            catch(e) {
            }


            decodificando = false;


            /*
            Volvemos rápidamente al reloj
            maestro del audio.
            */

            if (reproduciendo) {

                setTimeout(
                    actualizarVideo,
                    5
                );

            }

        };


    imagen.onerror =
        function() {


            try {

                URL_API.revokeObjectURL(
                    url
                );

            }

            catch(e) {
            }


            decodificando = false;


            if (reproduciendo) {

                setTimeout(
                    actualizarVideo,
                    5
                );

            }

        };


    imagen.src =
        url;

}


/*
=========================================================
PLAY
=========================================================
*/

function reproducir() {

    if (reproduciendo) {
        return;
    }


    reproduciendo = true;


    mostrar(
        "Reproduciendo..."
    );


    /*
    Es importante hacer audio.play()
    directamente después de tocar PLAY.

    Esto ayuda con las restricciones
    de audio de los navegadores.
    */

    try {

        audio.play();

    }

    catch(e) {

        mostrar(
            "ERROR AUDIO: " +
            e.message
        );

    }


    if (
        frames.length === 0 &&
        !finArchivo
    ) {

        descargarBloque();

    }


    actualizarVideo();

}


/*
=========================================================
PAUSA
=========================================================
*/

function pausar() {

    reproduciendo = false;


    try {

        audio.pause();

    }

    catch(e) {
    }


    mostrar(
        "Pausa"
    );

}


/*
=========================================================
VOLUMEN
=========================================================
*/

function cambiarVolumen(valor) {

    var volumen =
        parseInt(
            valor,
            10
        ) / 100;


    audio.volume =
        volumen;


    volumenTexto.innerHTML =
        "Volumen: " +
        valor +
        "%";

}


/*
=========================================================
MOSTRAR TIEMPO
=========================================================
*/

function formatoTiempo(segundos) {

    segundos =
        Math.floor(
            segundos || 0
        );


    var minutos =
        Math.floor(
            segundos / 60
        );


    var seg =
        segundos % 60;


    if (minutos < 10) {

        minutos =
            "0" +
            minutos;

    }


    if (seg < 10) {

        seg =
            "0" +
            seg;

    }


    return (
        minutos +
        ":" +
        seg
    );

}


/*
Actualizamos la pantalla de tiempo
dos veces por segundo.
*/

setInterval(
    function() {

        tiempoTexto.innerHTML =
            formatoTiempo(
                audio.currentTime
            );

    },
    500
);


/*
=========================================================
EVENTOS DEL AUDIO
=========================================================
*/

audio.onended =
    function() {

        reproduciendo = false;

        mostrar(
            "Fin del episodio"
        );

    };


audio.onerror =
    function() {

        mostrar(
            "ERROR cargando episodio1.mp3"
        );

    };


/*
=========================================================
PRECARGA MJPEG
=========================================================
*/

mostrar(
    "Preparando MJPEG + audio..."
);

descargarBloque();

</script>

</body>
</html>
